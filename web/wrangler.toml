# Cloudflare Worker: sahibindenfethiye.com.tr
name = "sahibindenfethiye"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# Dosya bulunamazsa Worker'a düşsün (sayfalar, admin, API)
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "sahibindenfethiye"
# Cloudflare panelinde veritabanını oluşturunca gösterilen kimliği buraya yapıştırın:
database_id = "5b54d720-8aae-4156-94ed-7257397a7990"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sahibindenfethiye-medya"

[vars]
SITE_URL = "https://sahibindenfethiye.com.tr"

# Gizli anahtar dosyada TUTULMAZ: panelden Settings > Variables and Secrets > SITE_TOKEN (Secret)
# Alan adı: panelde Workers > sahibindenfethiye > Settings > Domains & Routes > Add > Custom domain
