[package]
name = "emlak-ofis"
version = "1.9.0"
edition = "2021"
description = "Emlak ofisi portföy, CRM, mesai ve görev yönetimi"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_extras = { version = "0.31", features = ["datepicker"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
argon2 = "0.5"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
genpdf = { version = "0.2", features = ["images"] }
docx-rs = "0.4"
rfd = "0.15"
open = "5"
directories = "5"
chacha20poly1305 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
strip = true
codegen-units = 8
